<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&amp;family=Inter:wght@400;500&amp;display=swap');
      .brand    { font-family: 'Inter', system-ui, sans-serif; font-weight: 500; letter-spacing: 0.02em; }
      .eyebrow  { font-family: 'Inter', system-ui, sans-serif; font-weight: 500; letter-spacing: 0.28em; }
      .title    { font-family: 'Fraunces', 'Times New Roman', serif; font-weight: 400; letter-spacing: -0.03em; }
      .value    { font-family: 'Fraunces', 'Times New Roman', serif; font-weight: 400; letter-spacing: -0.005em; }
      .label    { font-family: 'Inter', system-ui, sans-serif; font-weight: 500; letter-spacing: 0.18em; }
      .cta      { font-family: 'Fraunces', 'Times New Roman', serif; font-style: italic; font-weight: 300; letter-spacing: 0.01em; }
      .tagline  { font-family: 'Fraunces', 'Times New Roman', serif; font-style: italic; font-weight: 300; letter-spacing: 0.02em; }
    </style>
    <radialGradient id="orbTop" cx="0.28" cy="0.14" r="0.6">
      <stop offset="0" stop-color="#5a9fbe" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5a9fbe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbBottom" cx="0.85" cy="0.9" r="0.55">
      <stop offset="0" stop-color="#7ab8d4" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7ab8d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="0" cy="0" r="1.4" fill="#2a3441" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1080" height="1350" fill="#0a0c10"/>
  <rect width="1080" height="1350" fill="url(#dots)"/>
  <rect width="1080" height="1350" fill="url(#orbTop)"/>
  <rect width="1080" height="1350" fill="url(#orbBottom)"/>

  <!-- header row -->
  <g transform="translate(96, 96)">
    <svg x="0" y="0" width="54" height="54" viewBox="2555 2555 3355 3355" preserveAspectRatio="xMidYMid meet">
      <path fill="#5a9fbe" d="M4055 2891l-86 49 -272 158 0 147 0 266 0 147 0 329 358 207 0 -330 0 -83 0 -330 0 -147 0 0 0 -413zm357 413l268 155 90 52 268 155 447 258 0 -413 -715 -413 0 0 -358 -207 0 413zm715 1239l0 206 -357 207 0 -1032 -90 -52 -268 -155 0 516 0 242 0 687 0 413 358 -206 89 -52 268 -155 358 -206 0 -619 -358 -207 0 413zm-1788 -826l0 -413 -357 207 0 1445 357 206 268 155 90 52 358 206 0 -79 0 -334 0 -142 0 -413 -358 -207 0 413 0 143 -358 -207 0 -1032z"/>
    </svg>
    <text x="74" y="38" class="brand" font-size="30" fill="#f1ece1">
      He<tspan fill="#5a9fbe">X</tspan>Talent<tspan fill="#8a8b8b">  ·  Recruitment</tspan>
    </text>
  </g>

  <!-- eyebrow -->
  <g transform="translate(96, 372)">
    <line x1="0" y1="24" x2="76" y2="24" stroke="#5a9fbe" stroke-width="2"/>
    <text x="94" y="32" class="eyebrow" font-size="24" fill="#5a9fbe">NEW OPPORTUNITY</text>
  </g>

  <!-- title -->
  <text x="96" y="530" class="title" font-size="108" fill="#f1ece1">HR Business</text>
  <text x="96" y="640" class="title" font-size="108" fill="#f1ece1">Partner</text>

  <!-- details section -->
  <line x1="96" y1="800" x2="984" y2="800" stroke="#2a2f37" stroke-width="1"/>

  <!-- Row: Employment -->
  <text x="96" y="870" class="label" font-size="15" fill="#8a8b8b">EMPLOYMENT</text>
  <text x="360" y="870" class="value" font-size="34" fill="#f1ece1">Full Time</text>

  <line x1="96" y1="910" x2="984" y2="910" stroke="#2a2f37" stroke-width="0.5" stroke-dasharray="3 5" opacity="0.6"/>

  <!-- Row: Location -->
  <text x="96" y="970" class="label" font-size="15" fill="#8a8b8b">LOCATION</text>
  <text x="360" y="970" class="value" font-size="34" fill="#f1ece1">Melbourne CBD</text>

  <line x1="96" y1="1010" x2="984" y2="1010" stroke="#2a2f37" stroke-width="0.5" stroke-dasharray="3 5" opacity="0.6"/>

  <!-- Row: Package -->
  <text x="96" y="1070" class="label" font-size="15" fill="#8a8b8b">PACKAGE</text>
  <text x="360" y="1070" class="value" font-size="34" fill="#f1ece1">Up to $150k plus Super</text>

  <line x1="96" y1="1110" x2="984" y2="1110" stroke="#2a2f37" stroke-width="1"/>

  <!-- CTA + tagline row -->
  <g transform="translate(96, 1210)">
    <text x="0" y="0" class="cta" font-size="34" fill="#f1ece1">More info to come</text>
    <path d="M 264 -10 L 296 -10 M 288 -18 L 296 -10 L 288 -2" stroke="#5a9fbe" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="984" y="1210" class="tagline" font-size="20" fill="#5a9fbe" text-anchor="end">The Humanistic eXchange</text>
</svg>
